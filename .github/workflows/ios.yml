# The action on an iOS app with app-hosted unit tests: a simulator found by name, booted, and given a permission.
name: iOS app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Choose an iPhone simulator of the newest iOS runtime
        id: device
        run: |
          name=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(p) for p in k.split(".iOS-")[1].split("-")], reverse=True)
          print(next(d["name"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))')
          echo "Simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: RyoHirota68/xcmutate@v0.13.0
        id: xcmutate
        with:
          project: App/App.xcodeproj
          scheme: App
          destination: platform=iOS Simulator,name=${{ steps.device.outputs.name }}
          simulator-permissions: |
            photos dev.example.App
          artifact-name: mutation-app
          args: |
            --only-testing
            AppTests

      - name: Outputs of the action
        run: |
          echo "exit-code: ${{ steps.xcmutate.outputs.exit-code }}"
          echo "score: ${{ steps.xcmutate.outputs.score }}"
          echo "undetected: ${{ steps.xcmutate.outputs.undetected }}"
